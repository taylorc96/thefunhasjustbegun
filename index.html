<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>First Challenge</title>
<style>
    body {
        background-color: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: 'Arial', sans-serif;
        color: #333;
        flex-direction: column;
        text-align: center;
        overflow: hidden;
        position: relative;
    }
    h1 {
        font-size: 2em;
        margin-bottom: 1em;
    }
    input, button, p {
        font-size: 1em;
    }
    input {
        padding: 0.5em;
        width: 300px;
        margin-bottom: 1em;
    }
    button {
        padding: 0.5em 1em;
        cursor: pointer;
        background-color: #444;
        color: #fff;
        border: none;
        border-radius: 5px;
    }
    p {
        margin-top: 1em;
        color: #333;
    }

    /* Congrats Nerd screen */
    #congratsScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 4em;
        font-weight: bold;
        color: #222;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1s ease;
        z-index: 998;
    }
    #congratsScreen.show {
        opacity: 1;
        pointer-events: auto;
    }

    /* Overlay for fade-to-black */
    #fadeOverlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: black;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1s ease;
        z-index: 999;
    }
</style>
</head>
<body>
    <div id="content">
        <h1>My namesake it is not (thanks a lot Isaiah you suck).<br>
            If it were up to precious this one would have stuck.<br>
            Don’t tyre out you are on your way to figuring out the big secret of the day
        </h1>
        <input type="text" id="answer" placeholder="Enter your answer here">
        <br>
        <button onclick="checkAnswer()">Submit</button>
        <p id="message"></p>
    </div>

    <!-- Congrats Nerd screen -->
    <div id="congratsScreen">Congrats Nerd</div>

    <!-- Fade overlay -->
    <div id="fadeOverlay"></div>

<script>
function checkAnswer() {
    const input = document.getElementById('answer').value.trim();
    const message = document.getElementById('message');
    const overlay = document.getElementById('fadeOverlay');
    const content = document.getElementById('content');
    const congrats = document.getElementById('congratsScreen');

    if(input.toLowerCase() === "tyrone") {
        // Hide the main content
        content.style.display = "none";

        // Show big Congrats Nerd
        congrats.classList.add("show");

        // Pause for 2 seconds, then fade to black
        setTimeout(() => {
            overlay.style.opacity = 1;
        }, 2000);

        // Redirect after fade
        setTimeout(() => {
            window.location.href = "second-page.html"; // replace with your second page URL
        }, 3500);
    } else {
        message.textContent = "Incorrect. Think carefully!";
    }
}
</script>
</body>
</html>
